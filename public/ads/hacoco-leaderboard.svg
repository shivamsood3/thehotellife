<svg xmlns="http://www.w3.org/2000/svg" width="970" height="90" viewBox="0 0 970 90" role="img" aria-label="Hacoco - Private Real Estate Capital">
  <defs>
    <linearGradient id="hcbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1526"/>
      <stop offset="0.55" stop-color="#131f38"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="hcgold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3c072"/>
      <stop offset="1" stop-color="#c29a41"/>
    </linearGradient>
  </defs>

  <rect width="970" height="90" fill="url(#hcbg)"/>
  <rect width="970" height="2" fill="url(#hcgold)"/>

  <!-- Mark -->
  <g transform="translate(34 30)">
    <rect x="0" y="0" width="30" height="30" rx="4" fill="none" stroke="url(#hcgold)" stroke-width="1.5"/>
    <rect x="8" y="8" width="14" height="14" rx="2" fill="url(#hcgold)"/>
  </g>

  <!-- Wordmark -->
  <text x="82" y="42" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="700" letter-spacing="4" fill="#f6f2e8">HACOCO</text>
  <text x="82" y="62" font-family="Arial, Helvetica, sans-serif" font-size="9.5" letter-spacing="3.2" fill="#9fb0cc">PRIVATE&#160;REAL&#160;ESTATE&#160;CAPITAL</text>

  <!-- Divider -->
  <rect x="322" y="24" width="1" height="42" fill="#31405c"/>

  <!-- Message -->
  <text x="352" y="40" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#f6f2e8">Own a piece of prime India.</text>
  <text x="352" y="62" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#a9b7d0">Curated real-estate investments across South Delhi &amp; beyond.</text>

  <!-- CTA -->
  <g transform="translate(792 27)">
    <rect x="0" y="0" width="146" height="36" rx="18" fill="url(#hcgold)"/>
    <text x="73" y="23" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#0d1526">EXPLORE&#160;&#8594;</text>
  </g>
</svg>
