<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="The Hotel Life">
  <rect width="64" height="64" rx="14" fill="#1a1714"/>
  <!-- Serif H monogram in cream -->
  <g fill="#faf8f4">
    <!-- left stem -->
    <rect x="17" y="17" width="6" height="30"/>
    <!-- right stem -->
    <rect x="41" y="17" width="6" height="30"/>
    <!-- crossbar -->
    <rect x="17" y="29" width="30" height="6"/>
    <!-- serif feet -->
    <rect x="13" y="16" width="14" height="3"/>
    <rect x="13" y="45" width="14" height="3"/>
    <rect x="37" y="16" width="14" height="3"/>
    <rect x="37" y="45" width="14" height="3"/>
  </g>
  <!-- brass baseline accent -->
  <rect x="17" y="52" width="30" height="2.5" fill="#a9852f"/>
</svg>
