<svg xmlns="http://www.w3.org/2000/svg" width="300" height="600" viewBox="0 0 300 600" role="img" aria-label="The AntiAlias — a design and brand studio">
  <defs>
    <linearGradient id="aabg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#0b0b0c"/>
      <stop offset="1" stop-color="#141416"/>
    </linearGradient>
    <radialGradient id="aaglow" cx="0.7" cy="0.22" r="0.7">
      <stop offset="0" stop-color="#d9a066" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#d9a066" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aaamber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6b078"/>
      <stop offset="1" stop-color="#cf8f52"/>
    </linearGradient>
  </defs>

  <rect width="300" height="600" fill="url(#aabg)"/>
  <rect width="300" height="600" fill="url(#aaglow)"/>
  <rect x="0.5" y="0.5" width="299" height="599" fill="none" stroke="#26262a" stroke-width="1"/>

  <!-- pixel / anti-alias corner motif -->
  <g fill="url(#aaamber)">
    <rect x="34" y="52" width="7" height="7"/>
    <rect x="43" y="52" width="7" height="7" opacity="0.7"/>
    <rect x="34" y="61" width="7" height="7" opacity="0.7"/>
    <rect x="52" y="52" width="7" height="7" opacity="0.4"/>
    <rect x="43" y="61" width="7" height="7" opacity="0.4"/>
    <rect x="34" y="70" width="7" height="7" opacity="0.25"/>
  </g>

  <!-- Wordmark -->
  <text x="34" y="132" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="5" fill="#8a8a90">THE</text>
  <text x="34" y="172" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" letter-spacing="1" fill="#f4f2ee">AntiAlias</text>
  <rect x="34" y="192" width="46" height="2" fill="url(#aaamber)"/>

  <!-- Statement -->
  <text x="34" y="288" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#f4f2ee">Make</text>
  <text x="34" y="322" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#f4f2ee">the edges</text>
  <text x="34" y="356" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-style="italic" fill="url(#aaamber)">disappear.</text>

  <!-- Subcopy -->
  <text x="34" y="416" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#b6b6bc">A design &amp; brand studio for</text>
  <text x="34" y="436" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#b6b6bc">companies that sweat the pixels.</text>

  <!-- CTA -->
  <g transform="translate(34 486)">
    <rect x="0" y="0" width="164" height="42" rx="21" fill="url(#aaamber)"/>
    <text x="82" y="27" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#141416">SEE&#160;THE&#160;WORK&#160;&#8594;</text>
  </g>

  <text x="34" y="556" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="2" fill="#7d7d84">THEANTIALIAS.COM</text>
</svg>
